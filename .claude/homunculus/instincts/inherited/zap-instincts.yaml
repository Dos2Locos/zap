# Zap Workflow Extend Ssh Manager Feature

## Action

Follow the extend-ssh-manager-feature workflow:
1. Modify or add Rust source files in crates/warp_ssh_manager/src (e.g., db.rs, repository.rs, types.rs, ssh_command.rs, sync_provider.rs).
2. Update or add related test files (e.g., ssh_command_tests.rs, server_view_tests.rs).
